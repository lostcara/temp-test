version: "3.8"

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-mongodb-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=your_database
      - MONGODB_ENABLE_AUTH=false
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - app-network

  # MongoDB 服务
  mongodb:
    image: mongo:7
    container_name: express-mongodb-db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=your_database
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
